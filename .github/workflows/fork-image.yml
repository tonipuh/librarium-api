# Fork-only: build a test image and push it to THIS fork's GHCR namespace.
# Self-contained (does not use the upstream release pipeline), so it has no
# release/tag/version side effects — just a pullable image for testing the fork
# before opening a PR. Not intended for upstream.
name: Fork image

on:
  workflow_dispatch:
  push:
    branches: [fork-build]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/librarium-api:finna-test
          build-args: VERSION=finna-test
